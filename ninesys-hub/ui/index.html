<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninesys Dev Hub</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --terminal-bg: #000000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 2rem;
            line-height: 1.5;
        }

        header {
            margin-bottom: 3rem;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: -0.025em;
            color: var(--accent);
        }

        p.subtitle {
            color: var(--text-dim);
            margin-top: 0.5rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto 3rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 1rem;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
        }

        .card h3 {
            font-size: 1.25rem;
            margin-bottom: 0.75rem;
            color: var(--text-main);
        }

        .card p {
            font-size: 0.9rem;
            color: var(--text-dim);
            flex-grow: 1;
            margin-bottom: 1.5rem;
        }

        .btn-run {
            background-color: var(--accent);
            color: var(--bg-dark);
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: opacity 0.2s;
        }

        .btn-run:hover {
            opacity: 0.9;
        }

        .terminal-container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--terminal-bg);
            border-radius: 0.75rem;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
        }

        .terminal-header {
            background: #27272a;
            padding: 0.75rem 1rem;
            font-size: 0.8rem;
            color: var(--text-dim);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #console {
            height: 400px;
            padding: 1rem;
            overflow-y: auto;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            color: #d1d5db;
        }

        .input-area {
            display: flex;
            background: #18181b;
            padding: 0.75rem 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-area span {
            color: var(--accent);
            margin-right: 0.5rem;
        }

        #terminal-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: white;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            outline: none;
        }

        .stdout {
            color: #10b981;
        }

        .stderr {
            color: #ef4444;
            font-weight: bold;
        }

        .system {
            color: var(--accent);
            font-style: italic;
        }

        .tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            margin-bottom: 1rem;
            display: inline-block;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <header>
        <h1>Ninesys Dev Hub</h1>
        <p class="subtitle">Centro de control interactivo para scripts de operaciones</p>
    </header>

    <div class="grid" id="scripts-grid">
        <!-- Scripts will be loaded here -->
    </div>

    <div class="terminal-container">
        <div class="terminal-header">
            <span>Terminal Interactive Output</span>
            <button onclick="clearConsole()"
                style="background: none; border: none; color: var(--text-dim); cursor: pointer; text-decoration: underline;">Limpiar</button>
        </div>
        <div id="console">Espere a ejecutar un script...</div>
        <div class="input-area">
            <span>&gt;</span>
            <input type="text" id="terminal-input" placeholder="Escribe un comando o envía entrada al script..."
                autocomplete="off">
        </div>
    </div>

    <script>
        const socket = io('http://localhost:4001');
        const consoleEl = document.getElementById('console');
        const inputEl = document.getElementById('terminal-input');

        async function loadScripts() {
            try {
                const res = await fetch('http://localhost:4001/api/scripts');
                const scripts = await res.json();
                const grid = document.getElementById('scripts-grid');

                const categoryColors = {
                    "Despliegue": "#8b5cf6",
                    "Base de Datos": "#ef4444",
                    "Sincronización": "#f59e0b",
                    "Reportes": "#10b981",
                    "Pruebas": "#06b6d4",
                    "Seguridad": "#38bdf8"
                };

                // Ordenar alfabéticamente por categoría
                scripts.sort((a, b) => a.category.localeCompare(b.category));

                grid.innerHTML = scripts.map(s => {
                    const color = categoryColors[s.category] || "var(--accent)";
                    const needsArg = s.category === "Base de Datos" || s.category === "Sincronización";
                    
                    return `
                    <div class="card" style="border-top: 3px solid ${color}">
                        <div style="display:flex; justify-content:space-between; align-items: center;">
                            <span class="tag" style="color: ${color}; background: ${color}22; border: 1px solid ${color}44">${s.category}</span>
                            ${needsArg ? '<span style="font-size:0.7rem; color:var(--text-dim)">Requiere ID</span>' : ''}
                        </div>
                        <h3>${s.name}</h3>
                        <p>${s.description}</p>
                        
                        ${needsArg ? `
                        <div style="margin-bottom: 1rem;">
                            <input type="text" class="company-id-input" data-id="${s.id}" placeholder="ID Empresa (ej. 174)" 
                                style="width: 100%; padding: 0.5rem; border-radius: 0.4rem; background: #0f172a; border: 1px solid #334155; color: white; font-size: 0.8rem;">
                        </div>
                        ` : ''}

                        <button class="btn-run" onclick="runScript('${s.id}', ${needsArg})">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                            Ejecutar Script
                        </button>
                    </div>
                `}).join('');
            } catch (e) {
                console.error('Error loading scripts:', e);
            }
        }

        function clearConsole() {
            consoleEl.innerHTML = '';
        }

        function log(msg, type = 'stdout') {
            const div = document.createElement('div');
            div.className = type;
            div.textContent = msg;
            consoleEl.appendChild(div);
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        function runScript(id, hasArg = false) {
            clearConsole();
            let args = [];
            
            if (hasArg) {
                const input = document.querySelector(`.company-id-input[data-id="${id}"]`);
                if (input && input.value.trim()) {
                    args.push(input.value.trim());
                } else if (hasArg) {
                    log("⚠️ Advertencia: No se proporcionó ID de empresa. Algunos scripts podrían fallar o usar un valor por defecto.", "system");
                }
            }
            
            socket.emit('run-script', { id, args });
        }

        socket.on('output', (data) => {
            log(data.msg, data.type);
        });

        socket.on('exit', (code) => {
            // log(`Script finalizado con código: ${code}`, 'system');
        });

        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const val = inputEl.value;
                if (val) {
                    socket.emit('input', val);
                    log(`Input: ${val}`, 'system');
                    inputEl.value = '';
                }
            }
        });

        loadScripts();
    </script>
</body>

</html>
